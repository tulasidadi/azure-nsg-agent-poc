name: NSG Plan and Apply

on:
  pull_request:
    paths:
      - "nsg-rules/**"
      - "terraform/**"
      - "policies/**"
      - ".github/workflows/nsg-plan-apply.yml"
  push:
    branches: ["main"]
    paths:
      - "nsg-rules/**"
      - "terraform/**"
      - "policies/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate NSG rule policies
        run: python policies/validate_rules.py

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="resource_group_name=${{ vars.AZURE_RESOURCE_GROUP }}" \
            -var="nsg_name=${{ vars.AZURE_NSG_NAME }}" \
            -var="rules_file=../nsg-rules/dev/${{ vars.AZURE_NSG_NAME }}.json" \
            -out=tfplan

      - name: Terraform Apply on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
